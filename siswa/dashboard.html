<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Siswa — Sistem Tes Online SMPN 13 Bandar Lampung</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/config.js"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; }
  .navy { background-color: #1E3A5F; }
  .navy-text { color: #1E3A5F; }
  .btn { padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; }
  .btn-primary { background: #1E3A5F; color: #fff; }
  .btn-primary:hover { background: #16304d; }
  .btn-secondary { background: #E5EDF5; color: #1E3A5F; }
  input { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; }
</style>
</head>
<body class="min-h-screen">

<div id="loginView" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <div class="text-center mb-6">
      <img id="loginLogo" class="h-14 mx-auto mb-3" alt="Logo Sekolah" />
      <h1 class="text-lg font-bold navy-text" id="loginNamaApp"></h1>
      <p class="text-xs text-gray-500" id="loginNamaSekolah"></p>
    </div>
    <label class="text-xs font-semibold text-gray-600">NISN / Username</label>
    <input id="loginUsername" class="mb-3" placeholder="NISN" />
    <label class="text-xs font-semibold text-gray-600">Password</label>
    <input id="loginPassword" type="password" class="mb-4" placeholder="Password" />
    <button onclick="doLogin()" class="btn btn-primary w-full">Masuk</button>
    <p id="loginError" class="text-red-600 text-xs mt-3 text-center"></p>
  </div>
</div>

<div id="mainView" class="hidden min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm text-center">
    <img id="mainLogo" class="h-14 mx-auto mb-3" alt="Logo Sekolah" />
    <h1 class="font-bold navy-text mb-1" id="namaSiswaTampil"></h1>
    <p class="text-xs text-gray-500 mb-6" id="kelasSiswaTampil"></p>

    <p class="text-sm text-gray-600 mb-2 text-left">Masukkan token ujian dari guru/admin untuk mulai mengerjakan:</p>
    <div class="flex gap-2">
      <input id="tokenInput" placeholder="Token" class="uppercase text-center font-bold tracking-widest" maxlength="6" />
      <button onclick="mulaiUjian()" class="btn btn-primary whitespace-nowrap">Mulai</button>
    </div>
    <button onclick="logoutUser()" class="btn btn-secondary w-full mt-6">Keluar</button>
  </div>
</div>

<script>
let TOKEN = null, USER = null;

document.getElementById('loginNamaApp').textContent = CONFIG.NAMA_APLIKASI;
document.getElementById('loginNamaSekolah').textContent = CONFIG.NAMA_SEKOLAH;
document.getElementById('loginLogo').src = CONFIG.LOGO_URL;
document.getElementById('mainLogo').src = CONFIG.LOGO_URL;

window.onload = function () {
  const saved = sessionStorage.getItem('sesiTesOnline');
  if (saved) {
    const s = JSON.parse(saved);
    TOKEN = s.token; USER = s.user;
    if (USER.role === 'SISWA') tampilkanMain();
  }
};

async function callApi(action, payload) {
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, payload: payload || {}, token: TOKEN }) });
  const json = await res.json();
  if (!json.success) throw new Error(json.message || 'Terjadi kesalahan.');
  return json.data;
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    const data = await callApi('login', { role: 'SISWA', username, password });
    if (!data.success) { errEl.textContent = data.message; return; }
    TOKEN = data.token; USER = data.user;
    sessionStorage.setItem('sesiTesOnline', JSON.stringify({ token: TOKEN, user: USER }));
    tampilkanMain();
  } catch (err) { errEl.textContent = 'Gagal terhubung: ' + err.message; }
}

function logoutUser() {
  callApi('logout', {}).catch(function(){});
  sessionStorage.removeItem('sesiTesOnline');
  location.reload();
}

function tampilkanMain() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('namaSiswaTampil').textContent = USER.nama;
  document.getElementById('kelasSiswaTampil').textContent = 'Kelas ' + USER.kelas;
}

function mulaiUjian() {
  const token = document.getElementById('tokenInput').value.trim().toUpperCase();
  if (!token) { alert('Masukkan token ujian terlebih dahulu.'); return; }
  // Simpan token sementara supaya ujian.html bisa langsung memakainya
  sessionStorage.setItem('tokenUjianDipilih', token);
  window.location.href = 'ujian.html?token=' + encodeURIComponent(token);
}
</script>
</body>
</html>
